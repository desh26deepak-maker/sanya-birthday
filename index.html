<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sanya! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f8f8f8;
        }
        .cake {
            font-size: 4rem;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        .btn {
            background: #fff;
            color: #ff477e;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s ease;
        }
        .btn:hover {
            background: #ff477e;
            color: #fff;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday Sanya!</h1>
        <div class="cake">🎂✨</div>
        <h2>A Very Special Day!</h2>
        <p>
            Aaj ka din sabse alag aur khubsurat hai kyunki aaj tumhara birthday hai! 
            Dua hai ki tumhari zindagi hamesha khushiyon, muskan aur dher saare pyaar se bhari rahe. Have an amazing day ahead! 🎉💖
        </p>
        <button class="btn" onclick="alert('Tumhari har ek wish poori ho Sanya! Happy Birthday once again! 🥳🎈')">Click For a Surprise! 🎁</button>
    </div>

</body>
</html>
